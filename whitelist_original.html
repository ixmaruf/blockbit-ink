    .wl-hero p {

    .wl-progress {

      margin: 2rem auto;

      padding: 0 2rem;
      position: relative;
      z-index: 1;
    }

    .wl-progress-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-bottom: 1rem;
    }

    .wl-progress-step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 16px;
      left: 55%;
      right: -45%;
      height: 2px;
      background: #e5e1f0;
      z-index: 0;
    }

    .wl-progress-step.active:not(:last-child)::after,
    .wl-progress-step.completed:not(:last-child)::after {
      background: #7538F5;
    }

    .wl-step-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #e5e1f0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      font-weight: 700;
      color: #8888aa;
      position: relative;
      z-index: 1;
      transition: all 0.3s;
    }

    .wl-progress-step.active .wl-step-number {
      border-color: #7538F5;
      background: #7538F5;
      color: white;
      box-shadow: 0 0 20px rgba(117, 56, 245, 0.3);
    }

    .wl-progress-step.completed .wl-step-number {
      border-color: #16A34A;
      background: #16A34A;
      color: white;
    }

    .wl-step-label {
      margin-top: 0.5rem;
      font-family: 'Silkscreen', monospace;
      font-size: 0.65rem;

      color: #8888aa;

    .wl-progress-step.active .wl-step-label {

    .wl-step-panel.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
